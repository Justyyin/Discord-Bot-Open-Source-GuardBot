[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = False
files = guardbot/store.py, guardbot/workers.py, guardbot/cog.py, guardbot/checks.py, guardbot/migrations.py, guardbot/defaults, guardbot/detect.py, guardbot/health.py, guardbot/logsetup.py, guardbot/metrics.py
